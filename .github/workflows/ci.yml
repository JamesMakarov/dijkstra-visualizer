name: Java build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile
        run: |
          mkdir -p build
          find src -name "*.java" -print0 | xargs -0 javac -cp "lib/*" -d build
